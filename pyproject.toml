[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-to-docs"
version = "0.1.0"
description = "AI engineering agent that generates evidence-grounded technical documentation from GitHub repositories."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "GitHub-to-Docs Agent"}]

dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "typer==0.12.3",
    "click==8.1.7",
    "fastapi>=0.111,<1",
    "httpx>=0.27,<1",
    "langgraph>=0.2,<1",
    "langchain-core>=0.3",
    "langchain-openai>=0.2,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[project.scripts]
github-to-docs = "github_to_docs.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["github_to_docs*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
